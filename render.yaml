# Render blueprint: New > Blueprint in the Render dashboard, pick this repo, then fill in the secrets.
services:
  - type: web
    name: brickhouse
    runtime: docker
    plan: starter            # 512 MB is tight for Chromium renders; the free plan also sleeps when idle
    branch: master
    healthCheckPath: /healthz
    autoDeploy: true         # every push to the branch redeploys
    envVars:
      - key: BRICKHOUSE_PASSWORD          # the password for the site; required on a public host
        sync: false
      - key: BRICKHOUSE_ANTHROPIC_API_KEY
        sync: false
      - key: BRICKHOUSE_ANTHROPIC_WORKSPACE_ID   # only for an organization-scoped key
        sync: false
      - key: BRICKHOUSE_EFFORT
        value: high
      - key: BRICKHOUSE_SITE_MODEL               # optional: a stronger model for mapping the house from above; unset uses the design model
        sync: false
      - key: BRICKHOUSE_DESIGN_BUDGET_USD        # a design stops at this many dollars of API time (site step included), keeping its last draft
        value: "15"
      - key: STRIPE_SECRET_KEY                   # design fee through Stripe Checkout; without it designs are free
        sync: false
      - key: BRICKHOUSE_DESIGN_FEE_CENTS         # the fee in cents
        value: "1500"
      - key: BRICKHOUSE_KIT_MINI_CENTS           # the kit's price in cents, Mini (16 x 16); unset: that size isn't on sale
        sync: false
      - key: BRICKHOUSE_KIT_CLASSIC_CENTS        # the kit's price in cents, Classic (32 x 32); unset: kits aren't on sale
        sync: false
      - key: BRICKHOUSE_KIT_GRAND_CENTS          # the kit's price in cents, Grand (48 x 48)
        sync: false
      - key: BRICKHOUSE_ADMIN_PASSWORD           # turns on /admin: designs, kit orders, the Brickwith parts file, fulfillment
        sync: false
      - key: RESEND_API_KEY                      # email (the design's link, kit orders, find my designs) through Resend
        sync: false
      - key: BRICKHOUSE_MAIL_FROM                # the sender, on a domain verified at Resend, e.g. Brickhouse <hello@yourdomain.com>
        sync: false
      - key: MAPILLARY_TOKEN                     # optional: street photos from the address box
        sync: false
      - key: BRICKHOUSE_GOBRICKS_QUOTES          # 0 turns off live GoBricks quotes on the Parts tab
        value: "1"
      - key: BRICKHOUSE_CNY_PER_USD              # GoBricks yuan per dollar at Brickwith, its store
        value: "3.5"
    disk:                    # keeps generated designs across deploys
      name: designs
      mountPath: /app/designs/generated
      sizeGB: 1
